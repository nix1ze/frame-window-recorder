name: Build GucciBot for GD 2.2074

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-guccibot-22074.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    env:
      CXXFLAGS: -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH
    steps:
      - name: Checkout build harness
        uses: actions/checkout@v4

      - name: Checkout GucciBot source
        uses: actions/checkout@v4
        with:
          repository: Nigelx1/GucciBot
          ref: master
          path: guccibot

      - name: Patch source for GD 2.2074 / Geode 4.0.0
        shell: powershell
        run: |
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)

          $p = 'guccibot/mod.json'
          $j = Get-Content $p -Raw | ConvertFrom-Json
          $j.geode = '4.0.0'
          $j.gd.win = '2.2074'
          $j.version = 'v2.0.0-beta.2-22074'
          $j.description = $j.description + ' (unofficial GD 2.2074 compatibility build)'
          $jsonText = $j | ConvertTo-Json -Depth 20
          [System.IO.File]::WriteAllText($p, $jsonText, $utf8NoBom)

          $cmake = 'guccibot/CMakeLists.txt'
          $src = Get-Content $cmake -Raw
          $src = $src.Replace('CPMAddPackage("gh:cursey/safetyhook#main")', 'CPMAddPackage("gh:cursey/safetyhook#661227263199a15a046b241bb096cf4501e6023a")')
          [System.IO.File]::WriteAllText($cmake, $src, $utf8NoBom)

          Get-ChildItem 'guccibot/src' -Recurse -File | Where-Object { $_.Extension -in '.cpp','.hpp','.h' } | ForEach-Object {
            $text = [System.IO.File]::ReadAllText($_.FullName)
            $text = [regex]::Replace($text, '(?<!:)std::', '::std::')
            [System.IO.File]::WriteAllText($_.FullName, $text, $utf8NoBom)
          }

          $gpu = 'guccibot/src/absense/gpu/client.cpp'
          $text = [System.IO.File]::ReadAllText($gpu)
          $text = $text.Replace('const uint32_t commandIndex = pl->m_gameState.m_commandIndex;', 'const uint32_t commandIndex = 0; // GD 2.2074 compatibility')
          [System.IO.File]::WriteAllText($gpu, $text, $utf8NoBom)

          # GD 2.2074 queueButton has no sub-frame timestamp parameter.
          $judge = 'guccibot/src/absense/judge.cpp'
          $text = [System.IO.File]::ReadAllText($judge)
          $text = $text.Replace('pl->queueButton(1, false, false, 0.0);', 'pl->queueButton(1, false, false);')
          $text = $text.Replace('pl->queueButton(1, true, false, 0.0);', 'pl->queueButton(1, true, false);')
          $text = $text.Replace('pl->queueButton(1, in.held, false, 0.0);', 'pl->queueButton(1, in.held, false);')
          [System.IO.File]::WriteAllText($judge, $text, $utf8NoBom)

          # These ledger hooks have no callable addresses in the 2.2074
          # bindings. Drop only those optional pathfinder hooks; core macro,
          # replay and frame-window functionality stays compiled.
          $hooks = 'guccibot/src/absense/hooks.cpp'
          $text = [System.IO.File]::ReadAllText($hooks)
          $patterns = @(
            '(?s)\r?\n    void rotateObjects\(cocos2d::CCArray\* objects, float rotation, cocos2d::CCPoint position,\r?\n                       cocos2d::CCPoint offset, bool finished, bool unused\) \{.*?\r?\n    \}',
            '(?s)\r?\n    void rotateObject\(GameObject\* object, float rotation\) \{.*?\r?\n    \}',
            '(?s)\r?\n    void transformAreaObjects\(GameObject\* object, cocos2d::CCArray\* objects, float scaleX, float scaleY,\r?\n                              bool reset\) \{.*?\r?\n    \}',
            '(?s)\r?\n    void toggleGroup\(int id, bool activate\) \{.*?\r?\n    \}',
            '(?s)\r?\nclass \$modify\(AbsEnhancedGameObject, EnhancedGameObject\) \{.*?\r?\n\};'
          )
          foreach ($pat in $patterns) { $text = [regex]::Replace($text, $pat, '') }
          [System.IO.File]::WriteAllText($hooks, $text, $utf8NoBom)

      - name: Build GucciBot
        id: build
        uses: geode-sdk/build-geode-mod@fa00cb245f128c40c90fd234c6347f635692c3ef
        with:
          path: guccibot
          sdk: 4.0.0
          target: Win64
          build-config: Release
          bindings: geode-sdk/bindings
          bindings-ref: 23c39fcda5dc660d8e92f3fb14f29b0a58a15f98
          ccache-variant: ''
          use-cpm-cache: false
          use-lto: false
          configure-args: -DSKIP_BUILDING_CODEGEN=OFF

      - name: Upload GucciBot 2.2074
        uses: actions/upload-artifact@v4
        with:
          name: GucciBot-Windows-GD-2.2074
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
