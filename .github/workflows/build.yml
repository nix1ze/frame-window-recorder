name: Build Windows Geode mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    env:
      CXXFLAGS: -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch source for GD 2.2074
        shell: powershell
        run: |
          $path = "src/main.cpp"
          $src = Get-Content $path -Raw
          $src = $src.Replace('return Mod::get()->getSettingValue<int>("max-shift");', 'return static_cast<int>(Mod::get()->getSettingValue<int64_t>("max-shift"));')
          $src = $src.Replace('return Mod::get()->getSettingValue<int>("inject-offset");', 'return static_cast<int>(Mod::get()->getSettingValue<int64_t>("inject-offset"));')
          $src = $src.Replace('void processCommands(float dt, bool p1, bool p2) {', 'void processCommands(float dt) {')
          $src = $src.Replace('GJBaseGameLayer::processCommands(dt, p1, p2);', 'GJBaseGameLayer::processCommands(dt);')
          Set-Content $path $src -NoNewline

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@fa00cb245f128c40c90fd234c6347f635692c3ef
        with:
          sdk: given
          target: Win64
          build-config: Release
          bindings: geode-sdk/bindings
          bindings-ref: 23c39fcda5dc660d8e92f3fb14f29b0a58a15f98
          ccache-variant: ''
          use-cpm-cache: false
          use-lto: false
          configure-args: -DSKIP_BUILDING_CODEGEN=OFF

      - name: Upload .geode
        uses: actions/upload-artifact@v4
        with:
          name: FrameWindowRecorder-Windows-2.2074
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error

  build-guccibot-22074:
    runs-on: windows-2022
    env:
      CXXFLAGS: -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH
    steps:
      - name: Checkout GucciBot beta.2
        uses: actions/checkout@v4
        with:
          repository: Nigelx1/GucciBot
          ref: v2.0.0-beta.2

      - name: Patch GucciBot metadata
        shell: powershell
        run: |
          $p = "mod.json"
          $j = Get-Content $p -Raw
          $j = $j.Replace('"geode": "5.10.1"', '"geode": "4.4.0"')
          $j = $j.Replace('"win": "2.2081"', '"win": "2.2074"')
          $j = $j.Replace('"version": "v2.0.0-beta.2"', '"version": "v2.0.0-beta.2-22074"')
          Set-Content $p $j -NoNewline

          $cm = "CMakeLists.txt"
          $cs = Get-Content $cm -Raw
          $cs = $cs.Replace('CPMAddPackage("gh:cursey/safetyhook#main")', 'CPMAddPackage("gh:cursey/safetyhook#755a4a08aa7d0d7143331dc854235ebc2d1570f9")')
          Set-Content $cm $cs -NoNewline

          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/Nigelx1/GucciBot/cbf684b3c6a527c5441e438063217024dc43663d/src/render/ffmpeg.hpp" -OutFile "src/render/ffmpeg.hpp"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/Nigelx1/GucciBot/14ee5382bd577eb80d86ee88a7388e24f5e72222/src/render/colorspace/colorspace.hpp" -OutFile "src/render/colorspace/colorspace.hpp"

      - name: Build GucciBot for GD 2.2074
        id: gucci
        uses: geode-sdk/build-geode-mod@fa00cb245f128c40c90fd234c6347f635692c3ef
        with:
          sdk: v4.4.0
          target: Win64
          build-config: Release
          bindings: geode-sdk/bindings
          bindings-ref: 23c39fcda5dc660d8e92f3fb14f29b0a58a15f98
          ccache-variant: ''
          use-cpm-cache: false
          use-lto: false
          configure-args: -DSKIP_BUILDING_CODEGEN=OFF

      - name: Upload GucciBot 2.2074
        uses: actions/upload-artifact@v4
        with:
          name: GucciBot-Windows-2.2074
          path: ${{ steps.gucci.outputs.build-output }}
          if-no-files-found: error
