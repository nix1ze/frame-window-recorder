name: Build Windows Geode mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch source for GD 2.2074
        shell: powershell
        run: |
          $path = "src/main.cpp"
          $src = Get-Content $path -Raw
          $src = $src.Replace('return Mod::get()->getSettingValue<int>("max-shift");', 'return static_cast<int>(Mod::get()->getSettingValue<int64_t>("max-shift"));')
          $src = $src.Replace('return Mod::get()->getSettingValue<int>("inject-offset");', 'return static_cast<int>(Mod::get()->getSettingValue<int64_t>("inject-offset"));')
          $src = $src.Replace('void processCommands(float dt, bool p1, bool p2) {', 'void processCommands(float dt) {')
          $src = $src.Replace('GJBaseGameLayer::processCommands(dt, p1, p2);', 'GJBaseGameLayer::processCommands(dt);')
          Set-Content $path $src -NoNewline

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@fa00cb245f128c40c90fd234c6347f635692c3ef
        with:
          sdk: given
          target: Win64
          build-config: Release
          bindings: geode-sdk/bindings
          bindings-ref: 23c39fcda5dc660d8e92f3fb14f29b0a58a15f98
          ccache-variant: ''
          use-cpm-cache: false
          use-lto: false
          configure-args: -DCMAKE_CXX_FLAGS=-D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH

      - name: Diagnose generated binding symbols
        if: always()
        shell: powershell
        run: |
          Write-Host "=== Generated source matches ==="
          if (Test-Path "build/bindings/bindings/Geode/GeneratedSource.cpp") {
            Select-String -Path "build/bindings/bindings/Geode/GeneratedSource.cpp" -Pattern "handleButton|processCommands|resetLevel|levelComplete|ButtonSprite::create|FLAlertLayer::create" -Context 2,2
          }
          Write-Host "=== GeodeBindings symbols ==="
          if (Test-Path "build/bindings/GeodeBindings.lib") {
            & "$env:GITHUB_WORKSPACE/llvm/bin/llvm-nm.exe" -C "build/bindings/GeodeBindings.lib" | Select-String "handleButton|processCommands|resetLevel|levelComplete|ButtonSprite::create|FLAlertLayer::create"
          }
          Write-Host "=== Mod object undefined/defined symbols ==="
          $obj = Get-ChildItem -Path build -Recurse -Filter main.cpp.obj | Select-Object -First 1
          if ($obj) {
            & "$env:GITHUB_WORKSPACE/llvm/bin/llvm-nm.exe" -C $obj.FullName | Select-String "handleButton|processCommands|resetLevel|levelComplete|ButtonSprite::create|FLAlertLayer::create"
          }

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bindings-diagnostics-2.2074
          path: |
            build/bindings/bindings/Geode/GeneratedSource.cpp
            build/bindings/bindings/Geode/binding
          if-no-files-found: ignore

      - name: Upload .geode
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FrameWindowRecorder-Windows-2.2074
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
