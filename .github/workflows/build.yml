name: Build Windows Geode mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pin LLVM 19
        shell: powershell
        run: |
          choco install llvm --version=19.1.7 -y --allow-downgrade --force
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "C:\Program Files\LLVM\bin\clang.exe" --version

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Win64
          build-config: Release

      - name: Upload .geode
        uses: actions/upload-artifact@v4
        with:
          name: FrameWindowRecorder-Windows-2.2074
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
